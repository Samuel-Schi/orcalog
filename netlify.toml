[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  [build.environment]
    HUSKY = "0"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/api-redash/*"
  to = "/.netlify/functions/proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api-recebimento/product"
  to = "/.netlify/functions/recebimento-product"
  status = 200
  force = true

[[redirects]]
  from = "/api-check-user"
  to = "/.netlify/functions/check-user"
  status = 200
  force = true

[[redirects]]
  from = "/api-bet-user-inf"
  to = "/.netlify/functions/bet-user-inf"
  status = 200
  force = true

[[redirects]]
  from = "/get_user_inf"
  to = "/.netlify/functions/get-user-inf"
  status = 200
  force = true

[[redirects]]
  from = "/get_produto_cadastro"
  to = "/.netlify/functions/get-produto-cadastro"
  status = 200
  force = true

[[redirects]]
  from = "/salvar-orcamento"
  to = "/.netlify/functions/salvar-orcamento"
  status = 200
  force = true

[[redirects]]
  from = "/get_orcamentos_analise"

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  [build.environment]
    HUSKY = "0"
    NODE_VERSION = "20"

[dev]
  command = "node ./node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173"
  targetPort = 5173
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://minhareceita.org https://*.supabase.co; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"

[[redirects]]
  from = "/api-check-user"
  to = "/.netlify/functions/check-user"
  status = 200
  force = true

